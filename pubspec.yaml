name: unipocket
description: "Student Expense Tracker for University Life"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Navigation
  go_router: ^13.2.0
  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  # Local Storage
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.3
  sqflite_common_ffi_web: ^0.4.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.2
  path: ^1.9.0
  # UI & Helpers
  google_fonts: ^6.3.3
  fl_chart: ^1.2.0
  intl: ^0.20.2
  table_calendar: ^3.2.0
  flutter_slidable: ^4.0.3
  pdf: ^3.11.1
  excel: ^4.0.6
  share_plus: ^12.0.2
  lottie: 3.3.0
  currency_picker: ^2.0.21
  local_auth: ^3.0.1
  flutter_native_splash: ^2.4.4
  home_widget: ^0.9.1
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  # Profile System Dependencies
  image_picker: ^1.1.2
  image_cropper: ^8.0.0
  uuid: ^4.4.0
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  # Code Generation
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  go_router_builder: ^2.6.2

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#6C63FF"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/splash_logo.png
  android_12:
    image: assets/images/splash_logo.png
    color: "#FFFFFF"
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
